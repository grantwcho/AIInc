[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ceo"
version = "0.1.0"
description = "A persistent AI CEO orchestrator with long-term memory and agent lifecycle control."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.50.0",
]

[project.scripts]
ai-ceo = "ai_ceo.cli:main"
ai-ceo-dashboard = "ai_ceo.dashboard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_ceo = ["dashboard_assets/*"]
